name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:src

  contracts:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: default
      ETH_RPC_URL: ""
      FOUNDRY_ETH_RPC_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Compile contracts and prepare the local compiler
        run: node app/scripts/forge.mjs build
      - name: Run all contract assertions without network access
        run: node app/scripts/forge.mjs test --offline -vv

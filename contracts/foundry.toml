[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]
# Local Monad EVM semantics (including P-256); no live endpoint is needed.
network = "monad"
chain_id = 10143

# Explicit opt-in for fork/integration work. Never selected by ordinary CI.
[profile.fork]
eth_rpc_url = "${ALCHEMY_MONAD_TESTNET_RPC_URL}"

[rpc_endpoints]
monad_testnet = "${ALCHEMY_MONAD_TESTNET_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
